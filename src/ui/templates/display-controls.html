  <!-- Post-processing toggles (top-right) -->
  <div id="pp-toggles" class="panel-collapsible collapsed" data-panel-id="pp-toggles">
    <div class="compact pp-header-row">
      <span class="pp-header-label" data-i18n="display.hudTitle">DISPLAY</span>
      <span class="panel-divider" aria-hidden="true"></span>
      <button class="panel-collapse-btn pp-collapse-btn" data-collapse-target="pp-toggles" title="Collapse panel" data-i18n-title="collapses.collapsePanel">&#x25C0;</button>
    </div>
    <div class="pp-panel-body" data-rail-scroller>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="hud-toggle" title="Intelligence HUD (H)" aria-label="Intelligence HUD (H)" data-i18n-title="display.hudTitle" data-i18n-aria="display.hudLabel">
        <span class="pp-icon">&#x25CE;</span>
        <span class="pp-label" data-i18n="display.hudLabel">HUD</span>
      </button>
      <div class="pp-slider-row" id="hud-layout-row">
        <span class="pp-slider-mini-label" data-i18n="display.hudLayout">Layout</span>
        <select id="hud-layout-select" class="pp-select" aria-label="HUD layout">
          <option value="tactical" data-i18n="display.hudLayoutTactical">Tactical</option>
          <option value="operator" data-i18n="display.hudLayoutOperator">Operator</option>
          <option value="minimal" data-i18n="display.hudLayoutMinimal">Minimal</option>
          <option value="cyber" data-i18n="display.hudLayoutCyber">Cyber</option>
        </select>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-toggle-row" id="cyber-sonar-row">
        <span class="pp-slider-mini-label" data-i18n="display.sonarLabel">Sonar</span>
        <button class="pp-mode-btn active" id="cyber-sonar-toggle" title="Cyber sonar contact scanner" aria-label="Cyber sonar contact scanner" aria-pressed="true" data-i18n-aria="display.sonarTitle" data-i18n="display.sonarOn">ON</button>
      </div>
      <output id="cyber-sonar-status" class="cyber-sonar-control" role="status"></output>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-rings-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-rings" data-i18n="display.sonarRings">Rings</label>
        <input type="range" class="pp-slider" id="cyber-sonar-rings" min="3" max="12" step="1" value="8" aria-label="Sonar ring count" />
        <span class="pp-slider-value" id="cyber-sonar-rings-value">8</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-range-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-range" data-i18n="display.sonarRange">Range</label>
        <input type="range" class="pp-slider" id="cyber-sonar-range" min="60" max="120" step="1" value="100" aria-label="Sonar ring range" />
        <span class="pp-slider-value" id="cyber-sonar-range-value">100%</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-intensity-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-intensity" data-i18n="display.sonarPower">Power</label>
        <input type="range" class="pp-slider" id="cyber-sonar-intensity" min="0" max="100" step="1" value="70" aria-label="Sonar intensity" />
        <span class="pp-slider-value" id="cyber-sonar-intensity-value">70%</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-opacity-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-opacity" data-i18n="display.sonarOpacity">Opacity</label>
        <input type="range" class="pp-slider" id="cyber-sonar-opacity" min="35" max="100" step="1" value="84" aria-label="Cyber contact and label opacity" title="Minimum opacity for map dots, icons, models, brackets, and labels between sonar passes" />
        <span class="pp-slider-value" id="cyber-sonar-opacity-value">84%</span>
      </div>
      <div class="pp-slider-row cyber-sonar-control cyber-sonar-setting" id="cyber-sonar-sector-row">
        <label class="pp-slider-mini-label" for="cyber-sonar-sector" data-i18n="display.sonarSector">Sector</label>
        <input type="range" class="pp-slider" id="cyber-sonar-sector" min="8" max="60" step="1" value="24" aria-label="Sonar sector width" />
        <span class="pp-slider-value" id="cyber-sonar-sector-value">24°</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="detection-toggle" title="Detection Overlay (D)" aria-label="Detection overlay" aria-pressed="false" data-i18n-title="display.detectionTitle" data-i18n-aria="display.detectionLabel">
        <span class="pp-icon">&#x25A3;</span>
        <span class="pp-label" data-i18n="display.detectionLabel">DETECT</span>
      </button>
      <div class="pp-slider-row detection-slider-row" id="detection-slider-row">
        <label class="pp-slider-mini-label" for="detection-density-slider" data-i18n="display.detectionDensity">Density</label>
        <input type="range" class="pp-slider" id="detection-density-slider" min="0" max="100" step="25" value="50" aria-label="Detection label density" />
        <span class="pp-slider-value" id="detection-density-value">50%</span>
      </div>
      <div class="pp-slider-row detection-allocation-row" id="detection-allocation-row">
        <span class="pp-slider-mini-label" data-i18n="display.detectionAllocation">Allocation</span>
        <div class="pp-mode-seg detection-allocation-seg" role="radiogroup" aria-label="Detection label allocation">
          <button class="pp-mode-btn active" id="detection-allocation-elastic" data-allocation="ELASTIC" role="radio" aria-checked="true" data-i18n="display.detectionAllocationElastic">Elastic</button>
          <button class="pp-mode-btn" id="detection-allocation-weighted" data-allocation="WEIGHTED" role="radio" aria-checked="false" data-i18n="display.detectionAllocationWeighted">Weighted</button>
        </div>
      </div>
      <div class="pp-slider-row detection-fade-row" id="detection-fade-row">
        <label class="pp-slider-mini-label" for="detection-fade-slider" data-i18n="display.detectionFade">Fade</label>
        <input type="range" class="pp-slider" id="detection-fade-slider" min="0" max="40" step="1" value="7" aria-label="Detection fade distance" title="World-overlay fade distance outside the keyhole as a percentage of its radius" />
        <span class="pp-slider-value" id="detection-fade-value">7%</span>
      </div>
      <div class="pp-slider-row detection-opacity-row" id="detection-opacity-row">
        <label class="pp-slider-mini-label" for="detection-opacity-slider" data-i18n="display.detectionOutside">Outside</label>
        <input type="range" class="pp-slider" id="detection-opacity-slider" min="0" max="100" step="1" value="1" aria-label="Detection opacity outside the keyhole" title="World-overlay label and card opacity beyond the fade distance" />
        <span class="pp-slider-value" id="detection-opacity-value">1%</span>
      </div>
    </div>
    <div id="param-slider-panel">
      <div class="param-panel-header">
        <span class="param-panel-title" data-i18n="layerPanel.cctvCalibrationTitle">PARAMETERS</span>
        <span class="param-panel-divider"></span>
        <button class="panel-collapse-btn" id="param-panel-collapse-btn" data-collapse-target="param-slider-panel" title="Collapse panel" data-i18n-title="collapses.collapsePanel">−</button>
      </div>
      <div id="param-sliders"></div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn active" id="models3d-toggle" aria-pressed="true" title="3D aircraft — flat icons zoomed out, 3D models up close" data-i18n-title="display.models3dTitle">
        <span class="pp-icon">&#x2708;</span>
        <span class="pp-label" data-i18n="display.models3dLabel">3D</span>
      </button>
      <div class="pp-slider-row visible" id="models3d-mode-row">
        <span class="pp-slider-mini-label" data-i18n="display.models3dMode">Models</span>
        <div class="pp-mode-seg" role="radiogroup" aria-label="3D model coverage">
          <button class="pp-mode-btn active" id="models3d-mode-proximity" data-mode="proximity" role="radio" aria-checked="true" data-i18n="display.models3dProximity">Proximity</button>
          <button class="pp-mode-btn" id="models3d-mode-all" data-mode="all" role="radio" aria-checked="false" data-i18n="display.models3dAll">All</button>
        </div>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn active" id="scope-toggle" title="Scope — the circular viewport mask" aria-pressed="true" data-i18n-title="display.scopeTitle">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">adjust</span>
        <span class="pp-label" data-i18n="display.scopeLabel">Scope</span>
      </button>
      <div class="pp-slider-row visible" id="scope-slider-row">
        <span class="pp-slider-mini-label" data-i18n="display.scopeFeather">Feather</span>
        <input type="range" class="pp-slider" id="scope-feather-slider" min="0" max="100" value="11" aria-label="Scope edge feather" title="Scope edge feather as a percentage of the keyhole radius" />
        <span class="pp-slider-value" id="scope-feather-value">11%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="draw-toggle" title="Draw on the world — click vertices, double-click or Enter to finish, Esc to cancel" aria-pressed="false" data-i18n-title="display.drawTitle">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">draw</span>
        <span class="pp-label" data-i18n="display.drawLabel">Draw</span>
      </button>
      <div class="pp-slider-row" id="draw-mode-row">
        <span class="pp-slider-mini-label" data-i18n="display.drawShape">Shape</span>
        <div class="pp-mode-seg" role="radiogroup" aria-label="Shape to draw">
          <button class="pp-mode-btn active" data-shape="area" role="radio" aria-checked="true" data-i18n="display.drawShapeArea">Area</button>
          <button class="pp-mode-btn" data-shape="line" role="radio" aria-checked="false" data-i18n="display.drawShapeLine">Line</button>
          <button class="pp-mode-btn" data-shape="pin" role="radio" aria-checked="false" data-i18n="display.drawShapePin">Pin</button>
        </div>
      </div>
      <div class="pp-slider-row" id="draw-label-row">
        <input type="text" class="pp-text-input" id="draw-label-input" maxlength="120" placeholder="Label (optional)" aria-label="Label for the drawn shape" autocomplete="off" spellcheck="false" data-i18n-placeholder="display.drawLabelPlaceholder" data-i18n-aria="display.drawColorLabel" />
        <select class="pp-select draw-color-select" id="draw-color-select" aria-label="Colour of the drawn shape">
          <option value="primary" data-i18n="display.drawColorPrimary">Primary</option>
          <option value="amber" data-i18n="display.drawColorAmber">Amber</option>
          <option value="cyan" data-i18n="display.drawColorCyan">Cyan</option>
          <option value="green" data-i18n="display.drawColorGreen">Green</option>
          <option value="red" data-i18n="display.drawColorRed">Red</option>
        </select>
        <button class="pp-mode-btn draw-clear-btn" id="draw-clear" type="button" title="Remove every mark from the board" data-i18n="display.drawClear">Clear</button>
        <span class="draw-hint" id="draw-hint" aria-live="polite"></span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="celestial-toggle" title="Celestial ring — reveal the full globe" aria-pressed="false" data-i18n-title="display.celestialTitle">
        <span class="pp-icon material-symbols-outlined" aria-hidden="true">flare</span>
        <span class="pp-label" data-i18n="display.celestialLabel">Celestial</span>
      </button>
    </div>
    <button class="pp-toggle-btn" id="clean-view-toggle" title="Hide UI chrome" data-i18n-title="display.cleanUiTitle">
      <span class="pp-icon">&#x25A1;</span>
      <span class="pp-label" data-i18n="display.cleanUiLabel">Clean UI</span>
    </button>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="bloom-toggle" title="Bloom / Glow" data-i18n-title="display.bloomTitle">
        <span class="pp-icon">&#x2728;</span>
        <span class="pp-label" data-i18n="display.bloomLabel">Bloom</span>
      </button>
      <div class="pp-slider-row" id="bloom-slider-row">
        <input type="range" class="pp-slider" id="bloom-intensity-slider" min="0" max="200" value="0" aria-label="Bloom intensity" />
        <span class="pp-slider-value" id="bloom-intensity-value">0%</span>
      </div>
    </div>
    <div class="pp-toggle-group">
      <button class="pp-toggle-btn" id="sharpen-toggle" title="Sharpening" data-i18n-title="display.sharpenTitle">
        <span class="pp-icon">&#x1F50D;</span>
        <span class="pp-label" data-i18n="display.sharpenLabel">Sharpen</span>
      </button>
      <div class="pp-slider-row" id="sharpen-slider-row">
        <input type="range" class="pp-slider" id="sharpen-intensity-slider" min="0" max="100" value="49" aria-label="Sharpen intensity" />
        <span class="pp-slider-value" id="sharpen-intensity-value">49%</span>
      </div>
    </div>
  </div>
  </div>
  <button id="clean-view-exit" title="Return UI controls" data-i18n-title="display.exitCleanUiTitle" data-i18n="display.exitCleanUi">EXIT CLEAN VIEW</button>
